name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1.
      - name: Toolchain evidence
        run: |
          xcode-select -p
          swift --version
          xcrun --show-sdk-version
      - name: Repository checks
        run: ./scripts/check-source.sh
      - name: Core checks and application source typecheck
        run: ./scripts/typecheck-app.sh
      - name: Cross-volume recovery checks
        run: ./scripts/check-cross-volume.sh
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1.
        with:
          fetch-depth: 0
      - name: Build and verify application with Command Line Tools
        env:
          CODESIGN_IDENTITY: "-"
        run: ./build.sh --no-install

      - name: Archive inspection bundle
        run: ditto -c -k --sequesterRsrc --keepParent build/FinderPack.app build/FinderPack-inspection.zip
      - name: Save inspectable build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1.
        with:
          name: FinderPack-inspection-only
          path: build/FinderPack-inspection.zip
          retention-days: 7
